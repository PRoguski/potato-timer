<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trening — Timer</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161c26;
    --line:#26303d;
    --text:#eef2f6;
    --muted:#8b98a8;
    --work:#c6ff3d;      /* praca */
    --work-ink:#12200a;
    --rest:#38bdf8;      /* przerwa */
    --rest-ink:#04222f;
    --prep:#f4a742;      /* rozgrzewka/schłodzenie */
    --prep-ink:#2a1a02;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ===== Ekran timera ===== */
  #stage{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px 20px;transition:background .35s ease;position:relative;
  }
  #stage.work{background:var(--work);color:var(--work-ink)}
  #stage.rest{background:var(--rest);color:var(--rest-ink)}
  #stage.prep{background:var(--prep);color:var(--prep-ink)}
  #stage.done{background:var(--panel);color:var(--text)}

  .phase{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;opacity:.72}
  .exercise{
    font-size:clamp(2rem,9vw,3.2rem);font-weight:800;line-height:1.1;
    margin:.35em 0 0;max-width:11ch;
  }
  .clock{
    font-variant-numeric:tabular-nums;font-weight:800;
    font-size:clamp(5rem,30vw,11rem);line-height:.95;margin:.05em 0;
    letter-spacing:-.02em;
  }
  .next{font-size:clamp(1.1rem,4vw,1.4rem);font-weight:600;opacity:.7;min-height:1.4em}
  .next b{font-weight:800}

  .progress{
    position:absolute;left:0;top:0;height:5px;background:rgba(0,0,0,.28);
    width:0;transition:width .25s linear;
  }
  .counter{position:absolute;top:14px;right:18px;font-size:.8rem;font-weight:700;opacity:.6}

  /* ===== Sterowanie ===== */
  #controls{
    display:flex;gap:12px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    background:var(--bg);border-top:1px solid var(--line);
  }
  button{
    flex:1;border:0;border-radius:14px;padding:18px 12px;font-size:1.05rem;font-weight:800;
    font-family:inherit;color:var(--text);background:var(--panel);cursor:pointer;
    transition:transform .08s ease,filter .15s ease;
  }
  button:active{transform:scale(.97)}
  button.primary{background:var(--work);color:var(--work-ink)}
  button.secondary{background:var(--panel);border:1px solid var(--line)}
  button:disabled{opacity:.4;cursor:default}

  /* ===== Lista planu ===== */
  details{background:var(--bg);border-top:1px solid var(--line)}
  summary{padding:14px 18px;color:var(--muted);font-weight:700;cursor:pointer;font-size:.9rem}
  .list{max-height:42dvh;overflow:auto;padding:0 12px 12px}
  .row{
    display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;
    border-bottom:1px solid var(--line);font-size:.92rem;
  }
  .row:last-child{border-bottom:0}
  .row.active{background:#1d2430}
  .row .idx{width:26px;color:var(--muted);font-weight:700;font-size:.82rem;text-align:right}
  .row .name{flex:1}
  .row .dur{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
  .row.head .name{font-weight:800;color:var(--text);letter-spacing:.04em}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.work{background:var(--work)} .dot.rest{background:var(--rest)}
  .dot.prep{background:var(--prep)} .dot.head{background:transparent}

  /* ===== Ustawienia ===== */
  #settingsBtn{width:50px;height:50px;padding:0;font-size:1.4rem}
  #settingsOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:flex-end}
  #settingsOverlay.open{display:flex}
  #settingsPanel{background:var(--panel);width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:24px;max-height:80dvh;overflow-y:auto;box-shadow:0 -4px 20px rgba(0,0,0,.5)}
  .settings-title{font-size:1.3rem;font-weight:800;margin:0 0 24px;color:var(--text)}
  .setting-item{margin-bottom:20px}
  .setting-label{font-size:.9rem;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
  .setting-value{color:var(--work)}
  input[type="range"]{width:100%;height:8px;border-radius:4px;background:var(--line);outline:none;-webkit-appearance:none;appearance:none}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--work);cursor:pointer;transition:.1s}
  input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--work);cursor:pointer;border:0;transition:.1s}
  .settings-footer{display:flex;gap:12px;margin-top:24px}
  .settings-footer button{flex:1}
  #resetBtn{background:var(--panel);border:1px solid var(--line)}

  /* Toggle switch */
  .toggle-switch{display:flex;align-items:center;gap:12px;cursor:pointer}
  input[type="checkbox"]{width:44px;height:24px;cursor:pointer;accent-color:var(--work);appearance:none;-webkit-appearance:none;position:relative;border-radius:12px;background:var(--line);border:none;transition:background .3s;flex-shrink:0}
  input[type="checkbox"]:checked{background:var(--work)}
  input[type="checkbox"]::-webkit-slider-thumb{display:none}

  /* Licznik czasu całego treningu */
  #remainingTime{
    padding:12px 16px;background:var(--panel);border-top:1px solid var(--line);
    text-align:center;font-size:.95rem;font-weight:700;color:var(--muted);
    letter-spacing:.05em;
  }
  #remainingTime .time{color:var(--work);font-size:1.2rem;font-weight:800}
</style>
</head>
<body>

<div id="stage" class="prep">
  <div class="progress" id="bar"></div>
  <div class="counter" id="counter"></div>
  <div class="phase" id="phase">Gotowy?</div>
  <div class="exercise" id="exercise">Trening interwałowy</div>
  <div class="clock" id="clock">00:00</div>
  <div class="next" id="next">Naciśnij „Start", żeby zacząć</div>
</div>

<div id="controls">
  <button class="secondary" id="prevBtn" disabled>‹ Wstecz</button>
  <button class="primary" id="startBtn">Start</button>
  <button class="secondary" id="nextBtn">Dalej ›</button>
  <button class="secondary" id="settingsBtn">⚙</button>
</div>

<div id="remainingTime">
  Pozostało: <span class="time" id="remainingTimeValue">00:00</span>
</div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <h2 class="settings-title">Ustawienia</h2>

    <div class="setting-item">
      <div class="setting-label">
        <span>Rozmiar nazwy ćwiczenia</span>
        <span class="setting-value" id="exerciseSizeValue">100%</span>
      </div>
      <input type="range" id="exerciseSize" min="70" max="150" value="100" step="5">
    </div>

    <div class="setting-item">
      <div class="setting-label">
        <span>Rozmiar „Następnie"</span>
        <span class="setting-value" id="nextSizeValue">100%</span>
      </div>
      <input type="range" id="nextSize" min="70" max="150" value="100" step="5">
    </div>

    <div class="setting-item">
      <div class="setting-label">
        <span>Czas pracy (sekundy)</span>
        <span class="setting-value" id="workTimeValue">60s</span>
      </div>
      <input type="range" id="workTime" min="30" max="120" value="60" step="10">
    </div>

    <div class="setting-item">
      <div class="setting-label">
        <span>Czas przerwy (sekundy)</span>
        <span class="setting-value" id="restTimeValue">30s</span>
      </div>
      <input type="range" id="restTime" min="15" max="60" value="30" step="5">
    </div>

    <div class="setting-item">
      <label class="toggle-switch">
        <input type="checkbox" id="wakeLockToggle">
        <span>Nie wyłączaj ekranu podczas treningu</span>
      </label>
    </div>

    <div class="settings-footer">
      <button class="secondary" id="resetBtn">Resetuj</button>
      <button class="primary" id="closeSettingsBtn">Gotowe</button>
    </div>
  </div>
</div>

<details>
  <summary>Pełny plan treningu (≈60 min)</summary>
  <div class="list" id="planList"></div>
</details>

<script>
// type: prep (rozgrzewka/schłodzenie), work (ćwiczenie), rest (przerwa), head (nagłówek – bez czasu)
const S = 30; // przerwa w sekundach
const plan = [
  {type:'head', name:'ROZGRZEWKA'},
  {type:'prep', name:'Skakanka spokojnie', t:120},
  {type:'prep', name:'Krążenia ramion, bioder, przysiady', t:180},

  {type:'head', name:'RUNDA 1'},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Pompki na podporach', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Rozpiętki z gumą', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Przysiad z gumą', t:60}, {type:'rest', name:'Przerwa', t:S},

  {type:'head', name:'RUNDA 2'},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Pompki wąskie (triceps)', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Wiosłowanie gumą', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Wykroki', t:60}, {type:'rest', name:'Przerwa', t:S},

  {type:'head', name:'RUNDA 3'},
  {type:'work', name:'Skakanka (sprint/wolno)', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Pompki wolne, głębokie', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Uginanie ramion (biceps)', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Martwy ciąg z gumą', t:60}, {type:'rest', name:'Przerwa', t:S},

  {type:'head', name:'RUNDA 4'},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Pompki diamentowe', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Odwodzenie ramion (barki)', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Skakanka', t:60}, {type:'rest', name:'Przerwa', t:S},
  {type:'work', name:'Plank na podporach', t:60}, {type:'rest', name:'Przerwa', t:S},

  {type:'head', name:'SCHŁODZENIE'},
  {type:'prep', name:'Rozciąganie: klatka, barki, uda, łydki', t:300},
];

// tylko kroki z czasem biorą udział w odliczaniu
const steps = plan.filter(p => p.type !== 'head');
const phaseLabel = {work:'Ćwiczenie', rest:'Przerwa', prep:'Rozgrzewka'};

const $ = id => document.getElementById(id);
const stage=$('stage'), phaseEl=$('phase'), exEl=$('exercise'),
      clockEl=$('clock'), nextEl=$('next'), barEl=$('bar'),
      counterEl=$('counter'), startBtn=$('startBtn'),
      prevBtn=$('prevBtn'), nextBtn=$('nextBtn');

let idx=0, remaining=steps[0].t, total=steps[0].t, tick=null, running=false;

function fmt(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}

// oblicz całkowity pozostały czas treningu
function calcRemainingTime(){
  let total = remaining; // obecny krok
  for(let i=idx+1; i<steps.length; i++){
    total += steps[i].t;
  }
  return total;
}

// prosty dźwięk (WebAudio, bez plików)
let actx;
function beep(freq=880,dur=0.15){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.18,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

function render(){
  const step=steps[idx];
  stage.className=step.type;
  phaseEl.textContent=phaseLabel[step.type]||'';
  exEl.textContent=step.name;
  clockEl.textContent=fmt(remaining);
  counterEl.textContent=(idx+1)+' / '+steps.length;
  const nxt=steps[idx+1];
  nextEl.innerHTML = nxt ? 'Następnie: <b>'+nxt.name+'</b>' : 'To ostatni element 💪';
  barEl.style.width = (100*(total-remaining)/total)+'%';

  // Pozostały czas całego treningu
  const remainingTotal = calcRemainingTime();
  document.getElementById('remainingTimeValue').textContent = fmt(remainingTotal);

  document.querySelectorAll('.row').forEach(r=>r.classList.remove('active'));
  const ar=document.querySelector('.row[data-step="'+idx+'"]');
  if(ar){ar.classList.add('active');ar.scrollIntoView({block:'nearest'});}
}

function goto(i){
  idx=Math.max(0,Math.min(steps.length-1,i));
  total=remaining=steps[idx].t;
  prevBtn.disabled=idx===0;
  render();
}

function tickDown(){
  remaining--;
  // ostrzeżenie 15 s przed końcem przerwy
  if(steps[idx].type==='rest' && remaining===15){ beep(440,.18); setTimeout(()=>beep(440,.18),200); }
  if(remaining<=3 && remaining>0) beep(660,.1);
  if(remaining<=0){
    beep(1046,.25);
    if(idx>=steps.length-1){ finish(); return; }
    idx++; total=remaining=steps[idx].t;
    prevBtn.disabled=false;
    beep(steps[idx].type==='rest'?520:988,.18);
  }
  render();
}

function start(){
  if(running) return;
  beep(988,.12);
  running=true; startBtn.textContent='Pauza'; startBtn.classList.remove('primary');
  tick=setInterval(tickDown,1000);
  if(settings.wakeLock) requestWakeLock();
}
function pause(){
  running=false; startBtn.textContent='Wznów'; startBtn.classList.add('primary');
  clearInterval(tick);
  releaseWakeLock();
}
function toggle(){ running?pause():start(); }

function finish(){
  clearInterval(tick); running=false;
  releaseWakeLock();
  stage.className='done';
  phaseEl.textContent='Koniec';
  exEl.textContent='Trening zaliczony 🎉';
  clockEl.textContent='00:00';
  nextEl.textContent='Świetna robota. Rozciągnij się i napij wody.';
  barEl.style.width='100%';
  startBtn.textContent='Od nowa'; startBtn.classList.add('primary');
  startBtn.onclick=()=>{ startBtn.onclick=toggle; goto(0); };
  beep(1319,.3);
}

startBtn.onclick=toggle;
prevBtn.onclick=()=>{ if(remaining<steps[idx].t-1){goto(idx);}else{goto(idx-1);} };
nextBtn.onclick=()=>{ if(idx<steps.length-1){goto(idx+1);}else{finish();} };

// budowa listy planu
const listEl=$('planList');
let stepPtr=0;
plan.forEach(p=>{
  const row=document.createElement('div');
  if(p.type==='head'){
    row.className='row head';
    row.innerHTML='<span class="dot head"></span><span class="idx"></span>'+
      '<span class="name">'+p.name+'</span><span class="dur"></span>';
  }else{
    const si=stepPtr++;
    row.className='row'; row.dataset.step=si;
    row.innerHTML='<span class="dot '+p.type+'"></span><span class="idx">'+(si+1)+'</span>'+
      '<span class="name">'+p.name+'</span><span class="dur">'+fmt(p.t)+'</span>';
    row.onclick=()=>{ pause(); goto(si); };
  }
  listEl.appendChild(row);
});

// ===== WAKE LOCK API =====
let wakeLockSentinel = null;

async function requestWakeLock(){
  if(!('wakeLock' in navigator)) return; // nie wspierane
  try{
    if(!wakeLockSentinel){
      wakeLockSentinel = await navigator.wakeLock.request('screen');
    }
  }catch(e){ console.log('Wake Lock error:', e); }
}

async function releaseWakeLock(){
  if(wakeLockSentinel){
    try{ await wakeLockSentinel.release(); wakeLockSentinel = null; }catch(e){}
  }
}

// Obsługa widoczności strony (Wake Lock się zwalnia gdy strona jest niewidoczna)
document.addEventListener('visibilitychange', async () => {
  if(document.hidden) await releaseWakeLock();
  else if(settings.wakeLock && running) await requestWakeLock();
});

// ===== USTAWIENIA (localStorage) =====
const defaultSettings = {
  exerciseSize: 100,
  nextSize: 100,
  workTime: 60,
  restTime: 30,
  wakeLock: false
};

let settings = {...defaultSettings};

function loadSettings(){
  try{
    const saved = localStorage.getItem('timerSettings');
    if(saved) settings = {...defaultSettings, ...JSON.parse(saved)};
  }catch(e){}
  applySettings();
}

function saveSettings(){
  try{ localStorage.setItem('timerSettings', JSON.stringify(settings)); }catch(e){}
}

function applySettings(){
  // Zastosuj rozmiary czcionek
  const exerciseScale = settings.exerciseSize / 100;
  const nextScale = settings.nextSize / 100;
  exEl.style.fontSize = (exerciseScale >= 1 ? 'clamp(' : '') +
    (2 * exerciseScale) + 'rem,' + (9 * exerciseScale) + 'vw,' + (3.2 * exerciseScale) + 'rem' + (exerciseScale >= 1 ? ')' : '');
  nextEl.style.fontSize = 'clamp(' + (1.1 * nextScale) + 'rem,' + (4 * nextScale) + 'vw,' + (1.4 * nextScale) + 'rem)';

  // Zaktualizuj wartości inputów
  $('exerciseSize').value = settings.exerciseSize;
  $('nextSize').value = settings.nextSize;
  $('workTime').value = settings.workTime;
  $('restTime').value = settings.restTime;

  // Zaktualizuj wyświetlane wartości
  $('exerciseSizeValue').textContent = settings.exerciseSize + '%';
  $('nextSizeValue').textContent = settings.nextSize + '%';
  $('workTimeValue').textContent = settings.workTime + 's';
  $('restTimeValue').textContent = settings.restTime + 's';
}

function resetSettings(){
  settings = {...defaultSettings};
  saveSettings();
  applySettings();
}

function updatePlan(){
  // Zaktualizuj plan z nowymi czasami
  const S = settings.restTime;
  plan.forEach(p => {
    if(p.type === 'work') p.t = settings.workTime;
    if(p.type === 'rest') p.t = S;
  });
  // Przebuduj listę
  listEl.innerHTML = '';
  stepPtr = 0;
  plan.forEach(p=>{
    const row=document.createElement('div');
    if(p.type==='head'){
      row.className='row head';
      row.innerHTML='<span class="dot head"></span><span class="idx"></span>'+
        '<span class="name">'+p.name+'</span><span class="dur"></span>';
    }else{
      const si=stepPtr++;
      row.className='row'; row.dataset.step=si;
      row.innerHTML='<span class="dot '+p.type+'"></span><span class="idx">'+(si+1)+'</span>'+
        '<span class="name">'+p.name+'</span><span class="dur">'+fmt(p.t)+'</span>';
      row.onclick=()=>{ pause(); goto(si); };
    }
    listEl.appendChild(row);
  });
}

// Ustawienia UI
const settingsOverlay = $('settingsOverlay');
const settingsBtn = $('settingsBtn');
const closeSettingsBtn = $('closeSettingsBtn');
const resetBtn = $('resetBtn');

settingsBtn.onclick = () => { settingsOverlay.classList.add('open'); };
closeSettingsBtn.onclick = () => { settingsOverlay.classList.remove('open'); };
settingsOverlay.onclick = (e) => { if(e.target === settingsOverlay) settingsOverlay.classList.remove('open'); };

$('exerciseSize').oninput = (e) => {
  settings.exerciseSize = parseInt(e.target.value);
  $('exerciseSizeValue').textContent = settings.exerciseSize + '%';
  exEl.style.fontSize = 'clamp(' + (2 * settings.exerciseSize / 100) + 'rem,' + (9 * settings.exerciseSize / 100) + 'vw,' + (3.2 * settings.exerciseSize / 100) + 'rem)';
  saveSettings();
};

$('nextSize').oninput = (e) => {
  settings.nextSize = parseInt(e.target.value);
  $('nextSizeValue').textContent = settings.nextSize + '%';
  nextEl.style.fontSize = 'clamp(' + (1.1 * settings.nextSize / 100) + 'rem,' + (4 * settings.nextSize / 100) + 'vw,' + (1.4 * settings.nextSize / 100) + 'rem)';
  saveSettings();
};

$('workTime').oninput = (e) => {
  settings.workTime = parseInt(e.target.value);
  $('workTimeValue').textContent = settings.workTime + 's';
  updatePlan();
  saveSettings();
};

$('restTime').oninput = (e) => {
  settings.restTime = parseInt(e.target.value);
  $('restTimeValue').textContent = settings.restTime + 's';
  updatePlan();
  saveSettings();
};

resetBtn.onclick = () => {
  resetSettings();
  updatePlan();
};

// Wake Lock toggle
$('wakeLockToggle').onchange = (e) => {
  settings.wakeLock = e.target.checked;
  saveSettings();
  if(running && e.target.checked) requestWakeLock();
  else if(!e.target.checked) releaseWakeLock();
};

// Załaduj ustawienia i inicjuj
loadSettings();
$('wakeLockToggle').checked = settings.wakeLock;
updatePlan();
goto(0);
</script>
</body>
</html>
